- hosts: localhost
  gather_facts: false
  vars:
    # A ci-tool merge request ahead of this bundle (from Depends-On).
    ci_tool_mr: "{{ zuul['items'] | selectattr('project.short_name', 'equalto', 'ci-tool') | list }}"
    # ci-tool is a placeholder in git-stream: its state is the data its
    # announcements carry.  Read it from git-stream, from the Depends-On
    # merge request if there is one, else what ci-tool last announced.
    tool_path: "{{ ('merge_requests/' ~ ci_tool_mr[0].change ~ '/data?sha=' ~ ci_tool_mr[0].patchset) if ci_tool_mr else 'data' }}"
    tool_url: "{{ forge_api ~ '/projects/ci-tool/' ~ tool_path }}"
  tasks:
    - name: Read ci-tool's state
      uri:
        url: "{{ tool_url }}"
        return_content: true
      register: tool_reply

    - name: Show it
      vars:
        version: "{{ tool_reply.json.sha[:8] }}"
      debug:
        msg: >-
          bundle {{ bundle_id }} with ci-tool {{ version }}
          {{ '(merge request !' ~ ci_tool_mr[0].change ~ ' speculatively merged)'
             if ci_tool_mr else '(as announced)' }}

    - name: Load ci-tool's configuration
      set_fact:
        tool: "{{ tool_reply.json.data }}"

    - name: Test bundle {{ bundle_id }}
      debug:
        msg: "{{ zuul.job }}: step {{ item }} of {{ steps }} on bundle {{ bundle_id }} ... ok"
      loop: "{{ range(1, steps | int + 1) | list }}"
      loop_control:
        pause: 4

    - name: Run the bundle through ci-tool
      shell: |
        sleep 3
        {% if zuul.job in (tool.broken_jobs | default([]) or []) %}
        echo "ci-tool: Segmentation fault in parse_manifest() for {{ bundle_id }}"
        exit 139
        {% elif (100 | random) < (flaky | float * 100) %}
        echo "curl: (7) Failed to connect to {{ bundle_id }}.bundles.local port 443: Network is unreachable"
        exit 1
        {% else %}
        echo "{{ bundle_id }}.bundles.local answered: 200 OK"
        {% endif %}

    - name: Done
      debug:
        msg: "{{ zuul.job }} passed on bundle {{ bundle_id }}"
