# Zuul + git-stream demo environment.
#
#   ./deploy.sh          build what's missing and start everything
#   ./demo.sh            guided presentation
#   ./stop.sh            stop everything, keep data; ./deploy.sh starts it again
#   ./clean.sh           remove containers, volumes and images
#
# Secrets (database passwords, tokens) come from .env, which deploy.sh
# creates on its first run (see .env.example).  Ports are published on
# 127.0.0.1 only; DEMO_BIND in .env widens that.
#
# Zuul runs unmodified.  The Zuul images (localhost/zuul:dev,
# localhost/zuul-executor:dev) are built natively from Zuul's source by
# deploy.sh; upstream images are amd64 only, and bubblewrap in the
# executor can't create namespaces under emulation.
#
#   http://localhost:8080   demo UI: announce bundles, watch jobs
#   http://localhost:8090   git-stream (the fake GitLab)
#   http://localhost:9000   Zuul web
#   http://localhost:8000   job logs
#
#   sender -> POST /api/stream -> git-stream -> GitLab webhook -> Zuul

name: zuul-git-stream-demo

x-zuul: &zuul
  image: ${ZUUL_IMAGE:-localhost/zuul:dev}
  restart: on-failure
  volumes:
    - ./etc_zuul:/etc/zuul:z
    - ./wait-for.sh:/usr/local/bin/wait-for.sh:z
    - certs:/var/certs:z

services:
  zk:
    # Mirror of docker.io/zookeeper
    image: quay.io/opendevmirror/zookeeper:latest
    volumes:
      - ./zoo.cfg:/conf/zoo.cfg:z
      - certs:/var/certs:z
    command:
      - sh
      - -c
      - until [ -e /var/certs/keystores/zk.pem ]; do sleep 1; done;
        exec zkServer.sh start-foreground

  mysql:
    # Mirror of docker.io/mariadb
    image: quay.io/opendevmirror/mariadb:latest
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: zuul
      MYSQL_USER: zuul
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_INITDB_SKIP_TZINFO: 1

  # The fake GitLab, configured by git-stream.toml.  Applies the events
  # POSTed to /api/stream (messages: it holds no job definitions), sends
  # GitLab webhooks to zuul-web, and retries failing jobs before
  # escalating them.
  git-stream:
    image: localhost/zuul-git-stream:latest
    build:
      context: ..
      dockerfile: devenv/Containerfile
    restart: on-failure
    ports:
      - "${DEMO_BIND:-127.0.0.1}:8090:8090"
    environment:
      GIT_STREAM_API_TOKENS: zuul=${ZUUL_API_TOKEN}
      GIT_STREAM_WEBHOOK_TOKEN: ${WEBHOOK_TOKEN}
    volumes:
      - ./git-stream.toml:/etc/git-stream/git-stream.toml:z
      - forge:/srv/git-stream
    command: ["git-stream"]

  # What stands in for the real repositories that hold Zuul's config in
  # production: ./repos/zuul-config (pipelines, jobs, playbooks) as a git
  # repository over HTTP.  Zuul reads it through its plain `git` driver.
  # It is committed again on every start, so a change to ./repos reaches
  # Zuul after ./deploy.sh.
  gitserver:
    image: localhost/zuul-git-stream:latest
    restart: on-failure
    volumes:
      - ./gitserver.py:/usr/local/bin/gitserver.py:z
      - ./repos:/srv/src:ro,z
      - gitrepos:/srv/git
    command: ["python3", "/usr/local/bin/gitserver.py", "/srv/src",
              "/srv/git", "8091"]

  # One-shot: announces the starting state (the placeholder projects Zuul's
  # tenant names, and what ci-tool announced first) as messages.
  seed:
    image: localhost/zuul-git-stream:latest
    restart: on-failure
    depends_on: [git-stream]
    environment:
      FORGE: http://git-stream:8090
    volumes:
      - ./seed.py:/usr/local/bin/seed.py:z
    command: ["python3", "/usr/local/bin/seed.py"]

  init:
    <<: *zuul
    restart: "no"
    volumes:
      - ./init.sh:/usr/local/bin/init.sh:z
      - ./certs-tools:/certs-tools:z
      - certs:/var/certs:z
    command: ["init.sh"]

  # The tenant names projects that must exist in git-stream before Zuul
  # loads it, so the scheduler also waits until seed.py has announced
  # ci-tool's state (the last thing it does).
  scheduler:
    <<: *zuul
    depends_on: [zk, mysql, git-stream, gitserver, seed]
    command:
      - wait-for.sh
      - zk:2281
      - mysql:3306
      - git-stream:8090
      - gitserver:8091
      - --
      - sh
      - -c
      - until python3 -c "import urllib.request as u;
        u.urlopen('http://git-stream:8090/api/v4/projects/ci-tool/data')";
        do echo "Waiting for seed.py"; sleep 2; done;
        exec zuul-scheduler -f

  merger:
    <<: *zuul
    depends_on: [zk, git-stream, gitserver]
    command: ["wait-for.sh", "zk:2281", "git-stream:8090", "gitserver:8091",
              "--", "zuul-merger", "-f"]

  executor:
    <<: *zuul
    image: ${ZUUL_EXECUTOR_IMAGE:-localhost/zuul-executor:dev}
    hostname: executor
    # Bubblewrap needs to create namespaces.
    privileged: true
    depends_on: [zk, git-stream, gitserver]
    volumes:
      - ./etc_zuul:/etc/zuul:z
      - ./wait-for.sh:/usr/local/bin/wait-for.sh:z
      - certs:/var/certs:z
      - logs:/srv/static/logs:z
      - executor-state:/var/lib/zuul
    command:
      - wait-for.sh
      - zk:2281
      - git-stream:8090
      - gitserver:8091
      - --
      - sh
      - -c
      - mkdir -p /var/lib/zuul/ssh &&
        { [ -f /var/lib/zuul/ssh/id_rsa ] ||
          ssh-keygen -q -t rsa -N '' -f /var/lib/zuul/ssh/id_rsa; } &&
        exec zuul-executor -f

  web:
    <<: *zuul
    depends_on: [zk, mysql]
    ports:
      - "${DEMO_BIND:-127.0.0.1}:9000:9000"
    command: ["wait-for.sh", "zk:2281", "mysql:3306", "--",
              "zuul-web", "-f"]

  logs:
    <<: *zuul
    ports:
      - "${DEMO_BIND:-127.0.0.1}:8000:8000"
    volumes:
      - ./logserver.py:/usr/local/bin/logserver.py:z
      - logs:/srv/static/logs:z
    command: ["python3", "/usr/local/bin/logserver.py"]

  demo-ui:
    image: localhost/zuul-git-stream:latest
    restart: on-failure
    depends_on: [git-stream, web]
    ports:
      - "${DEMO_BIND:-127.0.0.1}:8080:8080"
    environment:
      FORGE: http://git-stream:8090
      ZUUL_API: http://web:9000/api/tenant/example-tenant
    volumes:
      - ./demo-ui:/srv/demo-ui:z
    command: ["python3", "/srv/demo-ui/app.py"]

volumes:
  certs:
  forge:
  gitrepos:
  logs:
  executor-state:
